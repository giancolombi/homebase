# Local full-stack only — do NOT use in production (plaintext dev secrets).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: homebase
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d homebase"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    # Run all migrations before starting — initdb-mounted .sql files only
    # apply on a brand-new volume and silently drift as migrations are added.
    command: sh -c "pnpm run db:migrate && pnpm exec tsx api/index.ts"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/homebase
      JWT_SECRET: local-compose-dev-secret
      API_PORT: "3001"
      # Keep the local stack dev-flavored (the image bakes in production):
      # rate limiting and prod-only logging gates stay off.
      NODE_ENV: development
      # Optional integrations — pass through from the host shell if set.
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      API_URL: http://api:3001
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
